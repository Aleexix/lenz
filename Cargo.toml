[workspace]
resolver = "2"
members = ["crates/lenz-protocol", "crates/lenz-daemon", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
lenz-protocol = { path = "crates/lenz-protocol" }
anyhow = "1"
dirs = "6"
portable-pty = "0.9"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
