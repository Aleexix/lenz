appId: dev.lenz.app
productName: Lenz
copyright: Copyright © 2026 Lenz
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty ships N-API prebuilds that work in Electron as-is; no rebuild (and no C++ toolchain) needed.
npmRebuild: false
asar: true
# node-pty loads native binaries and spawns helper executables; they must live on disk.
asarUnpack:
  - "**/node_modules/node-pty/**"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Lenz-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Lenz
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.developer-tools
  artifactName: Lenz-${version}-${arch}.${ext}
  # Unsigned for internal use until there is an Apple Developer account.
  identity: null
dmg:
  title: Lenz ${version}
